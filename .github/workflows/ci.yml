name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt httpx
      - name: Run unit + API tests
        run: python -m unittest -v

  frontend:
    name: Frontend build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke (Chromium)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &
      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../frontend.log 2>&1 &
      - name: Wait for servers
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && curl -sf localhost:5173 > /dev/null && exit 0; sleep 2; done
          cat backend.log frontend.log; exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run smoke test
        run: node e2e/smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: e2e/screenshots

  docker:
    name: Docker compose (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start db + backend + frontend
        run: docker compose up -d --build
      - name: Smoke check through nginx
        run: |
          for i in $(seq 1 40); do curl -sf localhost:8080/api/health && break; sleep 3; done
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          curl -sf localhost:8080/dashboard | grep -q '<div id="root">'
          curl -sf localhost:8080/api/dashboard | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['revenue']>0; print('revenue', d['revenue'], 'alerts', d['alerts'])"
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  start-script:
    name: start.sh (без Docker)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run start.sh, check site and API through the Vite proxy
        run: |
          bash start.sh > start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:5173/api/health && break; sleep 3; done
          curl -sf localhost:5173/ | grep -q '<div id="root">'
          curl -sf localhost:5173/api/dashboard | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['revenue']>0; print('revenue', d['revenue'])"
      - name: start.sh log
        if: always()
        run: cat start.log
