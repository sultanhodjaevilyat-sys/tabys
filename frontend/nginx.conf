server {
  listen 80;
  root /usr/share/nginx/html;

  # Запросы к API отправляем в контейнер бэкенда
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
  }

  # SPA: любые другие адреса отдаём index.html, дальше маршрутизирует React Router
  location / {
    try_files $uri /index.html;
  }
}
