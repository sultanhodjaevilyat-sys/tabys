# Весь Tabys одной командой:  docker compose up --build
# Сайт: http://localhost:8080   API: http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tabys
      POSTGRES_PASSWORD: tabys
      POSTGRES_DB: tabys
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabys"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env   # ключи Gemini / Stripe; если файла нет — демо-режим
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://tabys:tabys@db:5432/tabys
      FRONTEND_URL: http://localhost:8080
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
